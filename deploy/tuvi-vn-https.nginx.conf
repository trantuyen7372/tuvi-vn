# TUVI-MANAGED: chỉ cài sau khi chứng chỉ thật đã tồn tại và nginx -t đạt.
server {
    listen 80;
    server_name xemtuvionline.vn www.xemtuvionline.vn;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/tuvi-vn-acme; try_files $uri =404; }
    location / { return 301 https://xemtuvionline.vn$request_uri; }
}
server {
    listen 443 ssl;
    server_name xemtuvionline.vn www.xemtuvionline.vn;
    ssl_certificate /etc/letsencrypt/live/xemtuvionline.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xemtuvionline.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/tuvi-vn-error.log crit;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 720s;
        proxy_send_timeout 720s;
        proxy_buffering off;
    }
}
