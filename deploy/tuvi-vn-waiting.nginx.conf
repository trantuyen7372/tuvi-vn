# TUVI-MANAGED: HTTPS/chứng chỉ chưa sẵn sàng; không phục vụ đăng nhập qua HTTP.
server {
    listen 80;
    server_name xemtuvionline.vn www.xemtuvionline.vn;
    access_log off;
    error_log /var/log/nginx/tuvi-vn-error.log crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/tuvi-vn-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/html;
        charset utf-8;
        add_header Retry-After 3600 always;
        return 503 '<!doctype html><html lang="vi"><meta charset="utf-8"><title>Tử Vi</title><h1>Website đang được chuẩn bị</h1><p>Chúng tôi đang hoàn tất kết nối bảo mật. Vui lòng quay lại sau.</p></html>';
    }
}
